<title>RB United</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;600;700&display=swap">
<style>
/* Layout: black intro with crest that flies into the nav, then a dark futuristic one-pager: hero + HUD ring, ticker, match, about, squad, membership, gallery, committee, sponsors, join, contact. */
:root{
  --bg:#0a0a0b; --panel:#131316; --panel-2:#1a1a1e; --line:#2a2a30;
  --fg:#f4f3f1; --muted:#a3a3aa; --red:#d8151d; --red-hot:#ff3b42;
  --display:"Barlow Condensed","Noto Sans Bengali","Arial Narrow",sans-serif;
  --body:"Barlow","Noto Sans Bengali",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:5rem}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;position:relative;z-index:1}
h1,h2,h3{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance}
html[lang="bn"] h1,html[lang="bn"] h2,html[lang="bn"] h3{font-style:normal;text-transform:none;line-height:1.25;font-weight:700}
a{color:inherit}
:focus-visible{outline:3px solid var(--red-hot);outline-offset:3px}
.eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.95rem;color:var(--red-hot);margin:0 0 .6rem}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:100%;z-index:40;background:linear-gradient(90deg,var(--red),var(--red-hot));box-shadow:0 0 14px var(--red-hot);transform:scaleX(0);transform-origin:left}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden}
#introBg{position:absolute;inset:0;background:#000;transition:opacity .9s ease .15s}
#introBg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(216,21,29,.35),transparent 55%);opacity:0;animation:introGlow 1.6s ease .2s forwards}
#introStage{position:relative;width:min(58vmin,430px);aspect-ratio:1;display:grid;place-items:center}
#introLogo{position:relative;width:100%;height:auto;opacity:0;scale:.55;animation:introIn 1.1s var(--ease) .15s forwards;filter:drop-shadow(0 0 30px rgba(216,21,29,.55));will-change:transform}
#introRing{position:absolute;inset:-9%;width:118%;height:118%;opacity:.9;transition:opacity .35s}
#introRing circle{fill:none;stroke:var(--red-hot);stroke-width:1.2;stroke-dasharray:630;stroke-dashoffset:630;animation:ringDraw 1.5s ease .2s forwards}
#introRing circle.b{stroke:#fff;stroke-opacity:.35;stroke-dasharray:3 9;animation:none;stroke-dashoffset:0}
#introTag{position:absolute;bottom:-3.2rem;left:0;right:0;text-align:center;font-family:var(--display);font-weight:700;letter-spacing:.5em;text-transform:uppercase;color:var(--muted);font-size:.95rem;opacity:0;animation:fade .8s ease 1s forwards;transition:opacity .3s}
#skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));font:600 .8rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--line);padding:.45rem .9rem;cursor:pointer}
@keyframes introIn{to{opacity:1;scale:1}}
@keyframes introGlow{to{opacity:1}}
@keyframes ringDraw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
body.intro{overflow:hidden}
body.intro header{opacity:0}
header{transition:opacity .6s ease}
#navLogo{opacity:0}
.brand span{opacity:0;translate:-12px 0;transition:opacity .6s ease .1s,translate .6s var(--ease) .1s}
body.ready #navLogo{opacity:1}
body.ready .brand span{opacity:1;translate:0 0}

/* ---------- nav ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,10,11,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{display:flex;align-items:center;gap:1rem;height:4rem;max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;font-family:var(--display);font-style:italic;font-weight:800;font-size:1.5rem;letter-spacing:.02em}
.brand img{width:40px;height:auto}
.brand b{color:var(--red-hot);font-weight:800}
nav ul{display:flex;gap:1.3rem;list-style:none;margin:0 0 0 auto;padding:0}
nav a{position:relative;text-decoration:none;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:1rem;color:var(--muted);padding-block:.3rem}
nav a::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--red-hot);scale:0 1;transform-origin:left;transition:scale .3s var(--ease)}
nav a:hover,nav a.on{color:var(--fg)}
nav a:hover::after,nav a.on::after{scale:1 1}
.lang,.burger{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 .9rem var(--body);padding:.4rem .8rem;cursor:pointer}
.lang:hover,.burger:hover{border-color:var(--red)}
.burger{display:none}
@media (max-width:900px){
  .burger{display:block;margin-left:auto}
  nav{position:absolute;left:0;right:0;top:100%;background:rgba(10,10,11,.97);border-bottom:1px solid var(--line);display:none;padding:1rem max(16px,env(safe-area-inset-left,0px))}
  nav.open{display:block}
  nav ul{flex-direction:column;gap:.9rem;margin:0}
}

/* ---------- reveal system ---------- */
.anim .rv{opacity:0;translate:0 34px;transition:opacity .8s var(--ease) var(--d,0s),translate .9s var(--ease) var(--d,0s)}
.anim .rv.in{opacity:1;translate:0 0}
.anim .rv-clip{opacity:0;clip-path:inset(0 100% 0 0);translate:-14px 0;transition:clip-path 1s var(--ease) var(--d,0s),opacity .3s ease var(--d,0s),translate 1s var(--ease) var(--d,0s)}
.anim .rv-clip.in{opacity:1;clip-path:inset(0 -2% 0 0);translate:0 0}
.anim .rv-pop{opacity:0;scale:.85;transition:opacity .7s var(--ease) var(--d,0s),scale .8s var(--ease) var(--d,0s)}
.anim .rv-pop.in{opacity:1;scale:1}
section{position:relative;padding-block:4.5rem;border-top:0}
section::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--red-hot),var(--line) 40%,transparent);scale:0 1;transform-origin:left;transition:scale 1.3s var(--ease)}
section.in::before,html:not(.anim) section::before{scale:1 1}
section h2{font-size:clamp(2.3rem,5.4vw,3.6rem);margin-bottom:1.6rem}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:2rem;align-items:center;padding-block:3.5rem 4rem;min-height:min(86vh,760px)}
.hero h1{font-size:clamp(3.4rem,10vw,7.2rem);margin-bottom:1.1rem}
.hero h1 em{font-style:inherit;color:var(--red-hot);text-shadow:0 0 28px rgba(255,59,66,.55)}
.hero p.lead{font-size:1.2rem;color:var(--muted);max-width:32rem;margin:0 0 1.8rem}
.crest-wrap{position:relative;width:100%;max-width:470px;justify-self:center;transition:transform .25s ease-out}
.crest{display:block;width:78%;margin:11% auto;height:auto;filter:drop-shadow(0 20px 50px rgba(216,21,29,.5));animation:float 6s ease-in-out infinite}
.hud{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hud *{fill:none;stroke:var(--red-hot);transform-box:fill-box;transform-origin:center}
.hud .r1{stroke-width:.6;stroke-dasharray:2 4;animation:spin 40s linear infinite}
.hud .r2{stroke:#fff;stroke-opacity:.35;stroke-width:.4;stroke-dasharray:.6 2.2;animation:spin 60s linear infinite reverse}
.hud .r3{stroke-width:1.2;stroke-dasharray:38 220;animation:spin 14s linear infinite}
.hud .r4{stroke-width:1.2;stroke-opacity:.8;stroke-dasharray:20 250;animation:spin 20s linear infinite reverse}
@keyframes spin{to{rotate:360deg}}
@keyframes float{50%{translate:0 -12px}}
.btns{display:flex;flex-wrap:wrap;gap:.8rem}
.btn{position:relative;overflow:hidden;display:inline-block;text-decoration:none;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:1.1rem;padding:.8rem 1.6rem;border:2px solid var(--red);cursor:pointer;background:var(--red);color:#fff;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:background .2s,box-shadow .2s}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s ease}
.btn:hover{background:var(--red-hot);border-color:var(--red-hot);box-shadow:0 0 28px rgba(255,59,66,.55)}
.btn:hover::after{left:130%}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--fg)}
.btn.ghost:hover{background:var(--fg);color:var(--bg);box-shadow:none}
.stats{display:flex;flex-wrap:wrap;gap:2.2rem;margin-top:2.4rem;padding-top:1.4rem;border-top:1px solid var(--line)}
.stats div{display:flex;flex-direction:column}
.stats strong{font-family:var(--display);font-size:2.4rem;font-weight:800;font-style:italic;line-height:1;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:.9rem}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding-block:2rem 3rem;min-height:0}.crest-wrap{order:-1;max-width:290px}}

/* ticker */
.ticker{overflow:hidden;border-block:1px solid var(--line);background:rgba(19,19,22,.8);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));position:relative;z-index:1}
.ticker div{display:flex;width:max-content;animation:tick 28s linear infinite}
.ticker span{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:1.7rem;letter-spacing:.06em;padding:.7rem 1.2rem;white-space:nowrap;color:transparent;-webkit-text-stroke:1px rgba(244,243,241,.55)}
.ticker span.h{color:var(--red-hot);-webkit-text-stroke:0}
@keyframes tick{to{translate:-50% 0}}

/* cards: spotlight + tilt */
.spot{position:relative;overflow:hidden}
.spot::after{content:"";position:absolute;inset:0;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(255,59,66,.2),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.spot:hover::after{opacity:1}
.tilt{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,border-color .2s}
.tilt:hover{border-color:var(--red)}

/* ---------- match ---------- */
.next{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--red);padding:2.2rem 1.4rem;text-align:center;clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.team{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(1.7rem,4.4vw,2.8rem);line-height:1.05;overflow-wrap:anywhere}
.vs{font-family:var(--display);font-weight:800;color:var(--red-hot);font-size:1.8rem;letter-spacing:.1em;text-shadow:0 0 18px rgba(255,59,66,.7)}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem 2rem;color:var(--muted);margin-top:.6rem;border-top:1px solid var(--line);padding-top:1rem}
.meta b{color:var(--fg);font-weight:600}
@media (max-width:600px){.next{grid-template-columns:1fr}}
.fixtures{margin-top:1.4rem;display:flex;flex-direction:column;gap:.6rem}
.fx{display:grid;grid-template-columns:5.5rem 1fr auto;gap:1rem;align-items:center;background:var(--panel);border:1px solid var(--line);padding:.9rem 1.1rem;transition:border-color .2s,translate .3s var(--ease)}
.fx:hover{border-color:var(--red);translate:6px 0}
.fx time{font-family:var(--display);font-weight:700;letter-spacing:.06em;color:var(--red-hot);text-transform:uppercase}
.tag{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:.15rem .6rem;color:var(--muted);white-space:nowrap}
@media (max-width:520px){.fx{grid-template-columns:4.6rem 1fr}.fx .tag{grid-column:2;justify-self:start}}
.note{color:var(--muted);font-size:.9rem;margin-top:1rem}

/* ---------- about ---------- */
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:3rem;align-items:start}
.about p{color:var(--muted);margin:0 0 1rem;max-width:38rem}
.values{display:grid;gap:.8rem}
.values div{background:var(--panel);border-left:4px solid var(--red);padding:1rem 1.2rem}
.values h3{font-size:1.5rem;margin-bottom:.3rem}
.values p{margin:0;font-size:.95rem}
@media (max-width:820px){.about{grid-template-columns:1fr;gap:2rem}}

/* ---------- squad ---------- */
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem}
.player{background:var(--panel);border:1px solid var(--line);padding:1.1rem 1.1rem 1.2rem}
.player .no{font-family:var(--display);font-style:italic;font-weight:800;font-size:4.8rem;line-height:.9;color:rgba(255,255,255,.07);position:absolute;right:.6rem;top:.4rem}
.player .pos{font-family:var(--display);font-weight:700;color:var(--red-hot);letter-spacing:.14em;text-transform:uppercase;font-size:.95rem}
.player h3{font-size:1.5rem;margin:2.6rem 0 .2rem;overflow-wrap:anywhere}
.player span.role{color:var(--muted);font-size:.9rem}

/* ---------- membership ---------- */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem;max-width:820px}
.tier{background:var(--panel);border:1px solid var(--line);padding:1.8rem 1.6rem;display:flex;flex-direction:column;gap:1rem}
.tier.core{border-color:var(--red);box-shadow:0 0 40px rgba(216,21,29,.18) inset}
.tier h3{font-size:2rem}
.tier .price{font-family:var(--display);font-weight:800;font-style:italic;font-size:1.6rem;color:var(--red-hot)}
.tier p{margin:0;color:var(--muted)}
.tier ul{margin:0;padding:0;list-style:none;display:grid;gap:.5rem}
.tier li{padding-left:1.4rem;position:relative}
.tier li::before{content:"";position:absolute;left:0;top:.55em;width:.7rem;height:.7rem;background:var(--red-hot);clip-path:polygon(0 0,100% 50%,0 100%)}
.tier .btn{margin-top:auto;text-align:center}

/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.tile{aspect-ratio:4/3;border:1px solid var(--line);display:grid;place-items:center;text-align:center;position:relative;background:
  repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 10px,transparent 10px 20px),linear-gradient(160deg,#1c1c20,#0f0f12)}
.tile i{font-family:var(--display);font-style:italic;font-weight:800;font-size:3.4rem;color:rgba(255,255,255,.08);position:absolute;left:.8rem;top:.2rem}
.tile span{font-family:var(--display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-size:.95rem}

/* ---------- committee + sponsors ---------- */
.cm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.mem{background:var(--panel);border:1px solid var(--line);padding:1.2rem}
.mem .av{width:56px;height:56px;border-radius:50%;background:linear-gradient(140deg,var(--red),#3a0508);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.5rem;margin-bottom:.9rem}
.mem h3{font-size:1.35rem}
.mem small{color:var(--red-hot);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.78rem}
.sp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}
.slot{border:1px dashed #44444c;min-height:96px;display:grid;place-items:center;color:var(--muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;padding:1rem;text-align:center}

/* ---------- join ---------- */
.join{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start}
.join p{color:var(--muted);margin:0 0 1rem}
form{background:var(--panel);border:1px solid var(--line);padding:1.5rem;display:grid;gap:1rem}
label{display:grid;gap:.35rem;font-weight:600;font-size:.95rem}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:.7rem .8rem;width:100%;border-radius:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red-hot);border-color:var(--red-hot)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.ok{border:1px solid var(--red);background:rgba(216,21,29,.12);padding:1rem;font-weight:500}
@media (max-width:820px){.join{grid-template-columns:1fr;gap:2rem}.row2{grid-template-columns:1fr}}

/* ---------- contact + footer ---------- */
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.contact div{background:var(--panel);border:1px solid var(--line);padding:1.1rem 1.2rem;min-width:0}
.contact small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;font-size:.75rem;margin-bottom:.3rem}
.contact span{user-select:all;overflow-wrap:anywhere}
footer{border-top:1px solid var(--line);padding-block:2rem 3rem;color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center}
footer img{width:44px;height:auto}
.fl{display:flex;align-items:center;gap:.8rem}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .crest,.hud *,.ticker div{animation:none}
  .btn,.btn::after,.fx,.tilt{transition:none}
}
</style>

<div id="bar"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="intro" role="presentation">
  <div id="introBg"></div>
  <div id="introStage">
    <svg id="introRing" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="98" transform="rotate(-90 100 100)"/><circle class="b" cx="100" cy="100" r="92"/></svg>
    <img id="introLogo" alt="RB United">
    <div id="introTag">Est. 2026</div>
  </div>
  <button id="skip" type="button">Skip</button>
</div>
